[package]
name = "camcraft-post"
description = "The post engine: CPS scripts in, NC program out, plus the machine-definition grammar (.mch types and reader) and our command-line post.exe. Clean-room implementation, public sources only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
camcraft-cl = { workspace = true }
camcraft-geometry = { workspace = true }
boa_engine = { workspace = true } # moved from app at M4.1 R3; hard-pinned in the workspace, sandboxed by js.rs
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# M4.2 WASM rung: boa's RNG chain needs the JS entropy source on
# wasm32-unknown-unknown (native builds never see this section).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
